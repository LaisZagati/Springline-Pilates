<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Springline — Cadillac, Mat &amp; Wall Unit Pilates</title>
  <meta name="description" content="Cadillac, Mat and Wall Unit Pilates exercise library and class planner in English and Spanish.">
  <meta name="theme-color" content="#F7F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1418" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <!-- Apple home-screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Springline">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/" aria-label="Springline — Cadillac, Mat and Wall Unit Pilates, home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--plum)"/><path d="M9 21c3-7 11-9 15-7" stroke="var(--ivory)" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M8 24h16" stroke="var(--blush)" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="9.5" r="2.4" fill="var(--blush)"/></svg>
        <span class="brand-text"><b>Springline</b><small>Cadillac, Mat &amp; Wall Unit Pilates</small></span>
      </a>
      <nav class="desk-nav" id="deskNav" aria-label="Main"></nav>
      <div class="lang" id="langSwitch" role="group" aria-label="Language / Idioma">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="es" aria-pressed="false">ES</button>
        <button data-lang="both" aria-pressed="false">EN+ES</button>
      </div>
      <button class="icon-btn search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:20px">Springline needs JavaScript to run.</p></noscript>

  <script>
    /* If anything fails to load, show what is wrong instead of a blank page. */
    window.SL_SHOW_ERROR = function (msg) {
      var m = document.getElementById('main'); if (!m || m.getAttribute('data-ok')) return;
      m.innerHTML = '<div style="max-width:560px;margin:40px auto;padding:22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-family:system-ui,sans-serif;line-height:1.5">' +
        '<h1 style="font-size:1.4rem;margin:0 0 10px">Springline could not start</h1>' +
        '<p style="margin:0 0 10px">' + msg + '</p>' +
        '<p style="margin:0">Check that <b>index.html</b>, <b>app.js</b>, <b>data.js</b> and <b>styles.css</b> are all in the <b>same folder</b>, with no older copies such as <i>app (1).js</i>, then reload the page.</p></div>';
    };
    window.addEventListener('error', function (ev) { window.SL_SHOW_ERROR('Error: ' + (ev.message || 'a file did not load') + (ev.filename ? ' (' + ev.filename.split('/').pop() + ')' : '')); }, true);
  </script>
  <script src="data.js" onerror="SL_SHOW_ERROR('The file data.js is missing.')"></script>
  <script src="app.js" onerror="SL_SHOW_ERROR('The file app.js is missing.')"></script>
  <script>
    if (!window.SPRINGLINE || !window.SPRINGLINE.length) SL_SHOW_ERROR('The exercise data did not load.');
  </script>
</body>
</html>
